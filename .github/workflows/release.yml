name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, Push & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to create GitHub Release
      packages: write       # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for changelog

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "${{ steps.version.outputs.VERSION }}" | head -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" | head -20)
          else
            COMMITS=$(git log ${PREV_TAG}..${{ steps.version.outputs.VERSION }} --pretty=format:"- %s")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.VERSION }}';
            const image = '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}';
            const commits = `${{ steps.changelog.outputs.COMMITS }}`;
            const rawUrl = `https://raw.githubusercontent.com/${{ github.repository }}/main`;

            const composeSnippet = [
              'services:',
              '  postgres:',
              '    image: postgres:16-alpine',
              '    container_name: gamevault-db',
              '    restart: unless-stopped',
              '    environment:',
              '      POSTGRES_DB: ${DB_NAME:-gamevault}',
              '      POSTGRES_USER: ${DB_USER:-gamevault}',
              '      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}',
              '    volumes:',
              '      - postgres_data:/var/lib/postgresql/data',
              '    healthcheck:',
              '      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gamevault} -d ${DB_NAME:-gamevault}"]',
              '      interval: 5s',
              '      timeout: 5s',
              '      retries: 10',
              '    networks:',
              '      - internal',
              '  app:',
              '    image: ' + image + ':' + version,
              '    container_name: gamevault-app',
              '    restart: unless-stopped',
              '    depends_on:',
              '      postgres:',
              '        condition: service_healthy',
              '    ports:',
              '      - "${PORT:-3000}:3000"',
              '    environment:',
              '      NODE_ENV: production',
              '      PORT: 3000',
              '      DB_HOST: postgres',
              '      DB_PORT: 5432',
              '      DB_NAME: ${DB_NAME:-gamevault}',
              '      DB_USER: ${DB_USER:-gamevault}',
              '      DB_PASSWORD: ${DB_PASSWORD}',
              '      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}',
              '      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}',
              '      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}',
              '      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}',
              '      ADMIN_USERNAME: ${ADMIN_USERNAME:-}',
              '      ADMIN_EMAIL: ${ADMIN_EMAIL:-}',
              '      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}',
              '      SMTP_HOST: ${SMTP_HOST:-}',
              '      SMTP_PORT: ${SMTP_PORT:-587}',
              '      SMTP_USER: ${SMTP_USER:-}',
              '      SMTP_PASS: ${SMTP_PASS:-}',
              '      EMAIL_FROM: ${EMAIL_FROM:-GameVault <noreply@gamevault.app>}',
              '      RAWG_API_KEY: ${RAWG_API_KEY:-}',
              '      TOTP_APP_NAME: ${TOTP_APP_NAME:-GameVault}',
              '    networks:',
              '      - internal',
              'volumes:',
              '  postgres_data:',
              'networks:',
              '  internal:',
            ].join('\n');

            const body = [
              '## GameVault ' + version,
              '',
              '### Changes',
              commits,
              '',
              '---',
              '',
              '### 🚀 Deploy (no git clone needed)',
              '',
              '**1. Download the environment template**',
              '```bash',
              'curl -O ' + rawUrl + '/.env.example',
              'cp .env.example .env',
              '```',
              '',
              '**2. Edit `.env`** — set `DB_PASSWORD`, `JWT_SECRET`, `REFRESH_TOKEN_SECRET`, and your `ADMIN_*` credentials at minimum.',
              '',
              '**3. Create a `docker-compose.yml`** with the following content and run `docker compose up -d`:',
              '',
              '```yaml',
              composeSnippet,
              '```',
              '',
              '---',
              '',
              '### 🔄 Update an existing install',
              '```bash',
              '# If running the pre-built image — just pull and restart:',
              "docker compose pull && docker compose up -d",
              '',
              '# If running from source:',
              'git pull && docker compose up -d --build',
              '```',
              '',
              '---',
              '',
              '### 📖 Full setup guide',
              'See the [README](https://github.com/${{ github.repository }}#readme) for Cloudflare Tunnel, Tailscale, and all environment variable documentation.',
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: 'GameVault ' + version,
              body: body,
              draft: false,
              prerelease: version.includes('-'),
            });

            console.log('Release created: GameVault ' + version);